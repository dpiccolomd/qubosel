name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=qubosel --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        with:
          files: coverage.xml
        continue-on-error: true

  qaoa:
    name: qaoa (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra qaoa
      - run: uv run pytest -m qaoa -o addopts="" tests/qaoa

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra docs
      - run: uv run mkdocs build --strict
