[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qubosel"
version = "0.1.0"
description = "Combinatorial (QUBO-based) feature selection with quantum-inspired solvers, consensus and built-in validation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Daniele Piccolo", email = "ing.daniele@gmail.com" }]
keywords = ["feature selection", "QUBO", "simulated annealing", "simulated bifurcation", "QAOA", "mutual information", "scikit-learn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.6",
  "pandas>=2.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
qaoa = ["pennylane>=0.45; python_version >= '3.11'"]
sb-torch = ["simulated-bifurcation>=2.0"]
dwave = ["dwave-samplers>=1.2"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/dpiccolomd/qubosel"
Documentation = "https://dpiccolomd.github.io/qubosel"
Issues = "https://github.com/dpiccolomd/qubosel/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qubosel"]

[tool.hatch.build.targets.sdist]
include = ["src/qubosel", "tests", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "qaoa: tests that require pennylane (run with -m qaoa)",
  "slow: slow tests",
  "replication: tests that need non-public data (opt-in)",
]
addopts = "-m 'not qaoa and not replication'"
filterwarnings = ["ignore::DeprecationWarning:pennylane.*"]

[tool.coverage.run]
source = ["qubosel"]
omit = ["src/qubosel/solvers/qaoa.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
ignore = ["RUF012", "B028"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF005"]
"examples/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
